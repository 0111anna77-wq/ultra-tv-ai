plugins { id 'com.android.application' }

android {
    namespace 'ai.ultra.tv'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'ai.ultra.tv'
        minSdk 23
        targetSdk 32
        versionCode 31
        versionName '0.31-tv-player-back-focus-fix'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
