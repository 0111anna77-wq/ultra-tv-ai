plugins { id 'com.android.application' }

android {
    namespace 'ai.ultra.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.ultra.tv'
        minSdk 23
        targetSdk 32
        versionCode 3
        versionName '0.3-tv-bundled'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
