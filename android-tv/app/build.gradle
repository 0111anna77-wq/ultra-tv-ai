plugins { id 'com.android.application' }

android {
    namespace 'ai.ultra.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.ultra.tv'
        minSdk 23
        targetSdk 32
        versionCode 12
        versionName '0.12-tv-watch-history'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
