name: Probe public player provider endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-players.yml'
      - 'scripts/probe_players.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe only public metadata endpoints
        run: python3 scripts/probe_players.py
