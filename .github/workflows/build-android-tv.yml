name: Build Ultra TV Android TV APK (preview)

on:
  push:
    branches:
      - feature/android-tv-app
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installed on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test safe ad-domain matching without emulator
        working-directory: android-tv
        run: |
          mkdir -p /tmp/ultratv-ad-tests
          javac -d /tmp/ultratv-ad-tests app/src/main/java/ai/ultra/tv/AdHostMatcher.java tests/AdHostMatcherTest.java
          java -cp /tmp/ultratv-ad-tests ai.ultra.tv.AdHostMatcherTest
      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK for install on Android TV 11
        uses: actions/upload-artifact@v4
        with:
          name: ultra-tv-ai-android-tv-adfilter-v02
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download (v0.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-v0.2-adfilter"
          APK="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" ultra-tv-ai-android-tv-v0.2.apk
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Ultra TV AI Android TV v0.2 (AdFilter preview)" \
              --notes "Android TV debug APK with experimental optional ad-host filtering. On KION, first install requires on-device confirmation. Filter coverage is not guaranteed. Debug builds can have differing signatures; installing as an update may fail."
          gh release upload "$TAG" ultra-tv-ai-android-tv-v0.2.apk --clobber
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ultra-tv-ai-android-tv-v0.2.apk"
