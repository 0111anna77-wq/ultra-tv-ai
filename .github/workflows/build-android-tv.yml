name: Build UVideo TV Android TV APK (preview)

on:
  push:
    branches:
      - feature/android-tv-app
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout live catalog snapshot from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: website-main
      - name: Bundle static website into Android TV APK
        run: |
          mkdir -p android-tv/app/src/main/assets/site
          for file in index.html player.js player.css releases.json watch-options.json tv-catalog.json tv-discover.json tv-summaries-ru.json; do
            cp "website-main/$file" "android-tv/app/src/main/assets/site/$file"
          done
          test -s android-tv/app/src/main/assets/site/index.html
          test -s android-tv/app/src/main/assets/site/player.js
          test -s android-tv/app/src/main/assets/site/watch-options.json
          test -s android-tv/app/src/main/assets/site/tv-catalog.json
          test -s android-tv/app/src/main/assets/site/tv-discover.json
          test -s android-tv/app/src/main/assets/site/tv-summaries-ru.json
          test -s android-tv/app/src/main/assets/tv.html
          test -s android-tv/app/src/main/assets/tv.css
          node --check android-tv/app/src/main/assets/tv.js
          node android-tv/tests/initem-progress.test.cjs
          node android-tv/tests/progress-display.test.cjs
          node --check android-tv/app/src/main/assets/site/player.js
          # Prevent regression to the 0.5 per-key layout scan and 110ms input gate.
          ! grep -q 'lastNav<110' android-tv/app/src/main/assets/tv.js
          grep -q 'function buildFocusRows' android-tv/app/src/main/assets/tv.js
          grep -q 'moveFocus(from,e.key)' android-tv/app/src/main/assets/tv.js
          grep -q 'signalNativePointer(true,x,y)' android-tv/app/src/main/assets/tv.js
          grep -q 'TvPointerOverlay' android-tv/app/src/main/java/ai/ultra/tv/UltraTvActivity.java
          ! grep -q 'tv-cursor' android-tv/app/src/main/assets/tv.js
          grep -q 'frame.requestFullscreen()' android-tv/app/src/main/assets/tv.js
          grep -q "player:video" android-tv/app/src/main/assets/tv.js
          grep -q 'IDLE_DELAY_MS = 2700L' android-tv/app/src/main/java/ai/ultra/tv/TvPointerOverlay.java
          ! grep -q 'final String legend' android-tv/app/src/main/java/ai/ultra/tv/TvPointerOverlay.java
          grep -q 'player-frame:fullscreen' android-tv/app/src/main/assets/tv.css
          grep -q 'data-act="appupdate"' android-tv/app/src/main/assets/tv.js
          grep -q 'AppUpdateManager' android-tv/app/src/main/java/ai/ultra/tv/UltraTvActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android-tv/app/src/main/AndroidManifest.xml
          ! grep -q 'function hero(){' android-tv/app/src/main/assets/tv.js
          ! grep -q 'data-act="fullscreen"' android-tv/app/src/main/assets/tv.js
          grep -q 'data-act="cursor" data-focus="player-cursor">⛶ Полный экран' android-tv/app/src/main/assets/tv.js
          grep -q 'getUnblockedHostSummary' android-tv/app/src/main/java/ai/ultra/tv/AdBlockFilter.java
          grep -q 'function catalog(){' android-tv/app/src/main/assets/tv.js
          grep -q 'async function loadSchedule(){' android-tv/app/src/main/assets/tv.js
          grep -q 'tv-discover.json' android-tv/app/src/main/assets/tv.js
          grep -q 'data-act="player-options"' android-tv/app/src/main/assets/tv.js
          grep -q 'function startCursor(){' android-tv/app/src/main/assets/tv.js
          grep -q 'startCursor();' android-tv/app/src/main/assets/tv.js
          grep -q 'settings-row' android-tv/app/src/main/assets/tv.css
          grep -q 'tv-progress-v1' android-tv/app/src/main/assets/tv.js
          grep -q 'function bindNativeVideoProgress' android-tv/app/src/main/assets/tv.js
          grep -q 'progress-save' android-tv/app/src/main/assets/tv.js
          grep -q 'data-act="continue"' android-tv/app/src/main/assets/tv.js
          ! grep -q 'Недавно открытые' android-tv/app/src/main/assets/tv.js
          grep -q 'function summaryRu' android-tv/app/src/main/assets/tv.js || grep -q 'const summaryRu' android-tv/app/src/main/assets/tv.js
          grep -q 'progress-save' android-tv/app/src/main/assets/tv.js
          grep -q 'searchParams.set.*season' android-tv/app/src/main/assets/tv.js
          grep -q 'detail-compact' android-tv/app/src/main/assets/tv.css
          node -e "const r=require('./android-tv/app/src/main/assets/site/tv-summaries-ru.json'); if(Object.keys(r.shows||{}).length<30) process.exit(1);"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installed on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test safe ad-domain matching without emulator
        working-directory: android-tv
        run: |
          mkdir -p /tmp/ultratv-ad-tests
          javac -d /tmp/ultratv-ad-tests app/src/main/java/ai/ultra/tv/AdHostMatcher.java tests/AdHostMatcherTest.java
          java -cp /tmp/ultratv-ad-tests ai.ultra.tv.AdHostMatcherTest
      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      # Important: GitHub's default debug.keystore changes between runners.
      # NEVER publish this unsigned-development/debug-signed APK as an in-place
      # update: Android will reject it because the certificate has changed.
      # Releases are signed using the persistent, non-public keystore stored
      # on the user's Windows PC (D:\\UltraTVTools\\signing) and then the
      # signed APK and checksum manifest are published together to main.
      - name: Reminder — stable signing is required for release
        run: |
          echo "CI builds development APKs only. Do not publish debug APK."
          echo "Sign with private persistent key, verify v2/v3, then publish a.apk + tv-update.json."
      - name: Upload APK for install on Android TV 11
        uses: actions/upload-artifact@v4
        with:
          name: uvideo-tv-android-tv-development-v016
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Transfer unsigned development build to temporary GitHub prerelease for signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-v0.16-unsigned-development"
          FILE="uvideo-tv-v0.16-UNSIGNED-DEBUG-DO-NOT-INSTALL.apk"
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk "$FILE"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "UNSIGNED DEVELOPMENT BUILD — DO NOT INSTALL" \
              --notes "Intermediate build transfer only. This uses GitHub's temporary debug key and is NOT an app update. The release will be signed on the authorized user's Windows PC using the stable private key."
          gh release upload "$TAG" "$FILE" --clobber
          echo "Intermediate unsigned build uploaded for local signing"


