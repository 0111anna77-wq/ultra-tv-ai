name: Build Ultra TV Android TV APK (preview)

on:
  push:
    branches:
      - feature/android-tv-app
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout live catalog snapshot from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: website-main
      - name: Bundle static website into Android TV APK
        run: |
          mkdir -p android-tv/app/src/main/assets/site
          for file in index.html player.js player.css releases.json watch-options.json; do
            cp "website-main/$file" "android-tv/app/src/main/assets/site/$file"
          done
          test -s android-tv/app/src/main/assets/site/index.html
          test -s android-tv/app/src/main/assets/site/player.js
          test -s android-tv/app/src/main/assets/site/watch-options.json
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installed on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test safe ad-domain matching without emulator
        working-directory: android-tv
        run: |
          mkdir -p /tmp/ultratv-ad-tests
          javac -d /tmp/ultratv-ad-tests app/src/main/java/ai/ultra/tv/AdHostMatcher.java tests/AdHostMatcherTest.java
          java -cp /tmp/ultratv-ad-tests ai.ultra.tv.AdHostMatcherTest
      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK for install on Android TV 11
        uses: actions/upload-artifact@v4
        with:
          name: ultra-tv-ai-android-tv-bundled-v03
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download (v0.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-v0.3-bundled"
          APK="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" ultra-tv-ai-android-tv-v0.3.apk
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Ultra TV AI Android TV v0.3 (bundled offline shell)" \
              --notes "Android TV debug APK containing a bundled offline-ready UI, plus optional experimental ad-host filtering. Initem playback still needs internet. Previous v0.2 debug installation requires uninstall if signature differs; local state may be lost."
          gh release upload "$TAG" ultra-tv-ai-android-tv-v0.3.apk --clobber
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ultra-tv-ai-android-tv-v0.3.apk"
