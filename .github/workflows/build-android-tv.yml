name: Build Ultra TV Android TV APK (preview)

on:
  push:
    branches:
      - feature/android-tv-app
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout live catalog snapshot from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: website-main
      - name: Bundle static website into Android TV APK
        run: |
          mkdir -p android-tv/app/src/main/assets/site
          for file in index.html player.js player.css releases.json watch-options.json tv-catalog.json; do
            cp "website-main/$file" "android-tv/app/src/main/assets/site/$file"
          done
          test -s android-tv/app/src/main/assets/site/index.html
          test -s android-tv/app/src/main/assets/site/player.js
          test -s android-tv/app/src/main/assets/site/watch-options.json
          test -s android-tv/app/src/main/assets/site/tv-catalog.json
          test -s android-tv/app/src/main/assets/tv.html
          test -s android-tv/app/src/main/assets/tv.css
          node --check android-tv/app/src/main/assets/tv.js
          node --check android-tv/app/src/main/assets/site/player.js
          # Prevent regression to the 0.5 per-key layout scan and 110ms input gate.
          ! grep -q 'lastNav<110' android-tv/app/src/main/assets/tv.js
          grep -q 'function buildFocusRows' android-tv/app/src/main/assets/tv.js
          grep -q 'moveFocus(from,e.key)' android-tv/app/src/main/assets/tv.js
          grep -q 'signalNativePointer(true,x,y)' android-tv/app/src/main/assets/tv.js
          grep -q 'TvPointerOverlay' android-tv/app/src/main/java/ai/ultra/tv/UltraTvActivity.java
          ! grep -q 'tv-cursor' android-tv/app/src/main/assets/tv.js
          grep -q 'frame.requestFullscreen()' android-tv/app/src/main/assets/tv.js
          grep -q "player:video" android-tv/app/src/main/assets/tv.js
          grep -q 'IDLE_DELAY_MS = 2700L' android-tv/app/src/main/java/ai/ultra/tv/TvPointerOverlay.java
          ! grep -q 'final String legend' android-tv/app/src/main/java/ai/ultra/tv/TvPointerOverlay.java
          grep -q 'player-frame:fullscreen' android-tv/app/src/main/assets/tv.css
          grep -q 'data-act="appupdate"' android-tv/app/src/main/assets/tv.js
          grep -q 'AppUpdateManager' android-tv/app/src/main/java/ai/ultra/tv/UltraTvActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android-tv/app/src/main/AndroidManifest.xml
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installed on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test safe ad-domain matching without emulator
        working-directory: android-tv
        run: |
          mkdir -p /tmp/ultratv-ad-tests
          javac -d /tmp/ultratv-ad-tests app/src/main/java/ai/ultra/tv/AdHostMatcher.java tests/AdHostMatcherTest.java
          java -cp /tmp/ultratv-ad-tests ai.ultra.tv.AdHostMatcherTest
      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK directly on Cloudflare Pages site (no GitHub download redirects)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ENCODED="$(base64 -w0 "$APK")"
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/a.apk?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$FILE_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/a.apk" \
              -f message="Publish direct Ultra TV AI Android TV v0.9 APK" \
              -f branch=main -f sha="$FILE_SHA" -f content="$ENCODED" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/a.apk" \
              -f message="Publish direct Ultra TV AI Android TV v0.9 APK" \
              -f branch=main -f content="$ENCODED" >/dev/null
          fi
          echo "Direct origin-hosted APK: https://ultra-tv-ai.pages.dev/a.apk"
      - name: Publish Android TV app version manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          HASH="$(sha256sum "$APK" | cut -d' ' -f1)"
          jq -n \
            --arg sha256 "$HASH" \
            --arg apkUrl "https://ultra-tv-ai.pages.dev/a.apk" \
            --arg versionName "0.9-tv-app-updater" \
            --arg notes "Добавлена проверка новой версии и системная установка APK прямо из приложения. Для обновления поверх старой версии нужна одинаковая подпись." \
            '{versionCode:9,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,notes:$notes}' > tv-update.json
          ENCODED="$(base64 -w0 tv-update.json)"
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/tv-update.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$FILE_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/tv-update.json" \
              -f message="Publish Android TV update metadata (v0.9)" \
              -f branch=main -f sha="$FILE_SHA" -f content="$ENCODED" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/tv-update.json" \
              -f message="Publish Android TV update metadata (v0.9)" \
              -f branch=main -f content="$ENCODED" >/dev/null
          fi
          echo "App update manifest: https://ultra-tv-ai.pages.dev/tv-update.json"
      - name: Upload APK for install on Android TV 11
        uses: actions/upload-artifact@v4
        with:
          name: ultra-tv-ai-android-tv-updater-v09
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download (v0.9)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-v0.9-updater"
          APK="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" ultra-tv-ai-android-tv-v0.9.apk
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Ultra TV AI Android TV v0.9 (in-app update checker and installer)" \
              --notes "Android TV v0.9 adds Settings > Check app update, HTTPS version manifest, SHA256 verified APK download, signature validation and Android system installation confirmation. A stable private signing key is required for actual in-place upgrades. Existing v0.8 debug signatures differ between CI runners; the first install may require uninstall and future releases must use one persistent signing key."
          gh release upload "$TAG" ultra-tv-ai-android-tv-v0.9.apk --clobber
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ultra-tv-ai-android-tv-v0.9.apk"
