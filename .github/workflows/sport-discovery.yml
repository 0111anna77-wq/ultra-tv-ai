name: Ultra TV Sport Lab metadata refresh

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'sport-lab/**'
      - '.github/workflows/sport-discovery.yml'

permissions:
  contents: read

concurrency:
  group: ultra-sport-refresh
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run standalone unit tests
        run: python3 sport-lab/test_update.py

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh football schedule metadata
        run: python3 sport-lab/update_sport.py
      - name: Commit only if fixtures changed
        shell: bash
        run: |
          if git diff --quiet -- sport-lab/data.json; then
            echo 'No sports metadata changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sport-lab/data.json
          git commit -m 'Update Ultra TV sport fixtures'
          git push
